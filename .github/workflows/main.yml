name: TMAS Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

# Grant necessary permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: write

env:
  CONTAINER_NAME: tmas-demo-github-flow
  TMAS_VERSION: latest

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    # Explicit permissions for this job
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        docker build -t ${{ env.CONTAINER_NAME }}:${{ github.sha }} .
        docker tag ${{ env.CONTAINER_NAME }}:${{ github.sha }} ${{ env.CONTAINER_NAME }}:latest
      working-directory: .
      
    - name: Download TMAS CLI
      run: |
        curl -L -o tmas-cli.tar.gz \
          "https://cli.artifactscan.cloudone.trendmicro.com/tmas-cli/latest/tmas-cli_Linux_x86_64.tar.gz"
        tar -xzf tmas-cli.tar.gz
        chmod +x tmas
        ./tmas version
        
    - name: Run TMAS Vulnerability Scan
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        ./tmas scan docker:${{ env.CONTAINER_NAME }}:latest \
          -V \
          --saveSBOM \
          --region ap-southeast-2 \
          --verbose > vulnerability-scan-results.json
      continue-on-error: true
      
    - name: Run TMAS Secret Scan
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        ./tmas scan docker:${{ env.CONTAINER_NAME }}:latest \
          --secrets \
          --region ap-southeast-2 \
          --verbose > secret-scan-results.json
      continue-on-error: true
      
    - name: Run TMAS Malware Scan
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        ./tmas scan docker:${{ env.CONTAINER_NAME }}:latest \
          --malware \
          --region ap-southeast-2 \
          --verbose > malware-scan-results.json
      continue-on-error: true
      
    - name: Run TMAS Comprehensive Scan with Overrides
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        ./tmas scan docker:${{ env.CONTAINER_NAME }}:latest \
          --vulnerabilities \
          --malware \
          --secrets \
          --override tmas_overrides.yml \
          --saveSBOM \
          --region ap-southeast-2 \
          --verbose > comprehensive-scan-results.json
      continue-on-error: false
      
    - name: TMAS Policy Evaluation - Secrets (Blocking)
      env:
        TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
      run: |
        echo "## TMAS Policy Evaluation" >> $GITHUB_STEP_SUMMARY
        echo "Running policy evaluation for secrets detection..." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Run TMAS scan with policy evaluation for secrets
        # This step will block the workflow if Vision One policy has blocking violations
        ./tmas scan docker:${{ env.CONTAINER_NAME }}:latest \
          --secrets \
          --evaluatePolicy \
          --region ap-southeast-2 \
          --verbose > policy-evaluation-results.json
        
        # Extract policy evaluation details
        POLICY_RESULT=$(jq -r '.policyEvaluation.result // "unknown"' policy-evaluation-results.json 2>/dev/null || echo "unknown")
        POLICY_NAME=$(jq -r '.policyEvaluation.policyEvaluated.name // "Unknown Policy"' policy-evaluation-results.json 2>/dev/null || echo "Unknown Policy")
        POLICY_VERSION=$(jq -r '.policyEvaluation.policyEvaluated.version // "Unknown"' policy-evaluation-results.json 2>/dev/null || echo "Unknown")
        
        # Check for blocking violations
        BLOCK_VIOLATIONS_COUNT=$(jq -r '.policyEvaluation.blockPolicyViolations | length' policy-evaluation-results.json 2>/dev/null || echo "0")
        SECRET_VIOLATIONS=$(jq -r '.policyEvaluation.blockPolicyViolations.secrets[0].numOfViolations // 0' policy-evaluation-results.json 2>/dev/null || echo "0")
        
        # Check for log-only violations
        LOG_VIOLATIONS_COUNT=$(jq -r '.policyEvaluation.logPolicyViolations | length' policy-evaluation-results.json 2>/dev/null || echo "0")
        
        echo "### Policy Evaluation Result" >> $GITHUB_STEP_SUMMARY
        echo "**Policy**: $POLICY_NAME (v$POLICY_VERSION)" >> $GITHUB_STEP_SUMMARY
        echo "**Result**: $POLICY_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Display violation details
        if [ "$BLOCK_VIOLATIONS_COUNT" -gt 0 ]; then
          echo "### 🚫 Blocking Policy Violations" >> $GITHUB_STEP_SUMMARY
          if [ "$SECRET_VIOLATIONS" -gt 0 ]; then
            echo "- **Secrets**: $SECRET_VIOLATIONS violations detected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "$LOG_VIOLATIONS_COUNT" -gt 0 ]; then
          echo "### 📝 Log-Only Policy Violations" >> $GITHUB_STEP_SUMMARY
          echo "- Non-blocking violations logged for review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Determine blocking action based on actual blocking violations
        if [ "$POLICY_RESULT" = "in-violation-of-log-and-block-rules" ] && [ "$BLOCK_VIOLATIONS_COUNT" -gt 0 ]; then
          echo "❌ **POLICY VIOLATION - BLOCKING**: Artifact contains violations that require blocking" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: Merge/deployment blocked until violations are resolved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Blocking Violations Found**:" >> $GITHUB_STEP_SUMMARY
          if [ "$SECRET_VIOLATIONS" -gt 0 ]; then
            echo "- **$SECRET_VIOLATIONS secrets** detected that violate blocking rules" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps**:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review detected secrets in the scan results" >> $GITHUB_STEP_SUMMARY
          echo "2. Remove or properly secure any real secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. Add legitimate test secrets to tmas_overrides.yml if needed" >> $GITHUB_STEP_SUMMARY
          echo "4. Re-run the workflow after fixes" >> $GITHUB_STEP_SUMMARY
          exit 1
        elif [ "$POLICY_RESULT" = "in-violation-of-log-and-block-rules" ] && [ "$BLOCK_VIOLATIONS_COUNT" -eq 0 ]; then
          echo "⚠️ **POLICY VIOLATIONS - LOG ONLY**: Non-blocking violations detected" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: Workflow can proceed, but review recommended" >> $GITHUB_STEP_SUMMARY
        elif [ "$POLICY_RESULT" = "compliant" ] || [ "$POLICY_RESULT" = "allow" ]; then
          echo "✅ **POLICY PASSED**: No policy violations detected" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: Workflow can proceed" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **POLICY UNKNOWN**: Unable to determine policy evaluation result" >> $GITHUB_STEP_SUMMARY
          echo "**Result**: $POLICY_RESULT" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: Manual review recommended" >> $GITHUB_STEP_SUMMARY
        fi
      # No continue-on-error - this step will block the workflow on blocking policy violations
      
    - name: Process Scan Results
      run: |
        echo "## TMAS Scan Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Process vulnerability results
        if [ -f vulnerability-scan-results.json ]; then
          echo "### Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.vulnerabilities | {totalVulnCount, criticalCount, highCount, mediumCount, lowCount}' vulnerability-scan-results.json >> $GITHUB_STEP_SUMMARY || echo "No vulnerability data found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Process secret results
        if [ -f secret-scan-results.json ]; then
          echo "### Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.secrets | {totalFilesScanned, unmitigatedFindingsCount}' secret-scan-results.json >> $GITHUB_STEP_SUMMARY || echo "No secret data found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Process malware results
        if [ -f malware-scan-results.json ]; then
          echo "### Malware Scan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.malware | {malwareCount, scannedFileCount}' malware-scan-results.json >> $GITHUB_STEP_SUMMARY || echo "No malware data found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "### Expected Results" >> $GITHUB_STEP_SUMMARY
        echo "This is a test container with intentionally embedded fake secrets." >> $GITHUB_STEP_SUMMARY
        echo "Expected findings include:" >> $GITHUB_STEP_SUMMARY
        echo "- 50+ secret detections (AWS keys, API tokens, passwords)" >> $GITHUB_STEP_SUMMARY
        echo "- Multiple vulnerability findings in base image and packages" >> $GITHUB_STEP_SUMMARY
        echo "- No malware detections (contains fake secrets, not malware)" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload Scan Results
      uses: actions/upload-artifact@v4
      with:
        name: tmas-scan-results-${{ github.sha }}
        path: |
          *-scan-results.json
          policy-evaluation-results.json
          sbom.json
        retention-days: 30
        
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sbom-${{ github.sha }}
        path: sbom.json
        retention-days: 90
        
    - name: Comment PR with Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          
          let comment = '## 🔍 TMAS Security Scan Results\n\n';
          comment += '> **Note**: This is a test container with intentionally embedded fake secrets for security testing.\n\n';
          
          // Check policy evaluation results first
          try {
            if (fs.existsSync('policy-evaluation-results.json')) {
              const policyResults = JSON.parse(fs.readFileSync('policy-evaluation-results.json', 'utf8'));
              const policyEval = policyResults.policyEvaluation || {};
              const policyResult = policyEval.result || 'unknown';
              const policyName = policyEval.policyEvaluated?.name || 'Unknown Policy';
              const policyVersion = policyEval.policyEvaluated?.version || 'Unknown';
              
              // Check for blocking violations
              const blockViolations = policyEval.blockPolicyViolations || {};
              const secretViolations = blockViolations.secrets?.[0]?.numOfViolations || 0;
              const hasBlockingViolations = Object.keys(blockViolations).length > 0;
              
              // Check for log violations
              const logViolations = policyEval.logPolicyViolations || {};
              const hasLogViolations = Object.keys(logViolations).length > 0;
              
              comment += '### 🛡️ Policy Evaluation\n';
              comment += `**Policy**: ${policyName} (v${policyVersion})\n`;
              comment += `**Result**: ${policyResult}\n\n`;
              
              if (policyResult === 'in-violation-of-log-and-block-rules' && hasBlockingViolations) {
                comment += '❌ **BLOCKED**: Policy violations detected that require blocking\n';
                if (secretViolations > 0) {
                  comment += `> **${secretViolations} secrets** detected that violate blocking rules\n`;
                }
                comment += '> This PR is blocked until violations are resolved.\n\n';
              } else if (policyResult === 'in-violation-of-log-and-block-rules' && !hasBlockingViolations) {
                comment += '⚠️ **LOG VIOLATIONS**: Non-blocking policy violations detected\n';
                comment += '> Review recommended but PR can proceed.\n\n';
              } else if (policyResult === 'compliant' || policyResult === 'allow') {
                comment += '✅ **PASSED**: No policy violations detected\n\n';
              } else {
                comment += `⚠️ **UNKNOWN**: Policy evaluation result unclear (${policyResult})\n\n`;
              }
            }
          } catch (error) {
            console.error('Error processing policy results:', error);
          }
          
          // Read and summarize scan results
          try {
            if (fs.existsSync('comprehensive-scan-results.json')) {
              const results = JSON.parse(fs.readFileSync('comprehensive-scan-results.json', 'utf8'));
              
              if (results.vulnerabilities) {
                comment += '### 🚨 Vulnerabilities\n';
                comment += `- **Total**: ${results.vulnerabilities.totalVulnCount || 0}\n`;
                comment += `- **Critical**: ${results.vulnerabilities.criticalCount || 0}\n`;
                comment += `- **High**: ${results.vulnerabilities.highCount || 0}\n`;
                comment += `- **Medium**: ${results.vulnerabilities.mediumCount || 0}\n`;
                comment += `- **Low**: ${results.vulnerabilities.lowCount || 0}\n\n`;
              }
              
              if (results.secrets) {
                comment += '### 🔐 Secrets\n';
                comment += `- **Files Scanned**: ${results.secrets.totalFilesScanned || 0}\n`;
                comment += `- **Findings**: ${results.secrets.unmitigatedFindingsCount || 0}\n`;
                comment += `- **Overridden**: ${results.secrets.overriddenFindingsCount || 0}\n\n`;
              }
              
              if (results.malware) {
                comment += '### 🦠 Malware\n';
                comment += `- **Files Scanned**: ${results.malware.scannedFileCount || 0}\n`;
                comment += `- **Malware Found**: ${results.malware.malwareCount || 0}\n\n`;
              }
            } else {
              comment += '⚠️ Comprehensive scan results not found. Individual scan results may be available.\n\n';
            }
          } catch (error) {
            console.error('Error processing scan results:', error);
            comment += `❌ Error processing scan results: ${error.message}\n\n`;
          }
          
          comment += '### ✅ Expected Behavior\n';
          comment += 'This container is designed for security testing and should trigger multiple findings.\n';
          comment += 'All secrets are fake and documented in the README.\n\n';
          comment += `📊 [View detailed results](${context.payload.pull_request.html_url}/checks)`;
          
          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('Successfully created PR comment');
          } catch (error) {
            console.error('Failed to create PR comment:', error);
            core.setFailed(`Failed to create PR comment: ${error.message}`);
          }

  security-policy-check:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: always()
    
    steps:
    - name: Download scan results
      uses: actions/download-artifact@v4
      with:
        name: tmas-scan-results-${{ github.sha }}
        
    - name: Evaluate Security Policies
      run: |
        echo "## Security Policy Evaluation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Example policy checks (customize based on your requirements)
        if [ -f comprehensive-scan-results.json ]; then
          # Check critical vulnerabilities
          CRITICAL_COUNT=$(jq -r '.vulnerabilities.criticalCount // 0' comprehensive-scan-results.json)
          HIGH_COUNT=$(jq -r '.vulnerabilities.highCount // 0' comprehensive-scan-results.json)
          SECRET_COUNT=$(jq -r '.secrets.unmitigatedFindingsCount // 0' comprehensive-scan-results.json)
          
          echo "### Policy Results" >> $GITHUB_STEP_SUMMARY
          echo "- Critical Vulnerabilities: $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- High Vulnerabilities: $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Unmitigated Secrets: $SECRET_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # For this test container, we expect findings
          if [ "$SECRET_COUNT" -gt 0 ]; then
            echo "✅ **PASS**: Test container correctly contains detectable secrets" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAIL**: Test container should contain detectable secrets" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This evaluation is inverted for the test container - we expect to find security issues." >> $GITHUB_STEP_SUMMARY
        fi
