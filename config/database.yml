  development:
    host: localhost
    port: 9200
    username: elastic
    password: elastic-dev-password-123
  staging:
    host: staging-es.example.com
    port: 9200
    username: elastic
    password: elastic-staging-password-456
    ssl: true
  production:
    host: prod-es.example.com
    port: 9200
    username: elastic
    password: elastic-prod-password-789
    ssl: true

# Message Queue Configuration
rabbitmq:
  development:
    host: localhost
    port: 5672
    username: guest
    password: rabbitmq-dev-password-123
    vhost: /
  staging:
    host: staging-rabbitmq.example.com
    port: 5672
    username: staging_user
    password: rabbitmq-staging-password-456
