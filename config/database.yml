# Redis Configuration
redis:
  development:
    host: localhost
    port: 6379
    password: redis-dev-password-123
    db: 0
  staging:
    host: staging-redis.example.com
    port: 6379
    password: redis-staging-password-456
    db: 0
  production:
    host: prod-redis.example.com
    port: 6379
    password: redis-prod-password-789
    db: 0

# MongoDB Configuration
mongodb:
  development:
    uri: mongodb://admin:MongoDevPass123@localhost:27017/testdb_dev
    options:
      authSource: admin
  staging:
    uri: mongodb://staging_user:MongoStagingPass456@staging-mongo.example.com:27017/testdb_staging
    options:
      authSource: admin
      ssl: true
  production:
    uri: mongodb://prod_user:MongoProdPass789@prod-mongo.example.com:27017/testdb_prod
    options:
      authSource: admin
      ssl: true
      replicaSet: rs0

# Elasticsearch Configuration
